# ZEF Framework — Coverage Runner (GitHub Actions)
#
# Fase 1 POC blueprint "GitLab -> GitHub Runner Cluster": menjalankan PHPUnit
# + Xdebug BRANCH coverage di GitHub-hosted runner (2 vCPU / 7 GB RAM, gratis
# utk repo public) sebagai KOMPLEMEN runner GitLab yang OOM (exit 137) saat
# job coverage branch.
#
# PARITAS 1:1 dengan job `coverage` di .gitlab-ci.yml zeflous/zef:
#   - PHP 8.4 + Xdebug 3.5.3 TER-PIN (mode=coverage) + composer install dari composer.lock
#     (pin = versi image CI GitLab :debug; lihat env XDEBUG_PIN + assert fail-closed)
#   - phpunit --configuration phpunit.xml.dist --coverage-clover / --coverage-text
#     (phpunit.xml.dist memuat <coverage pathCoverage="true"> -> branch coverage)
#   - verifikasi clover: test -s var/coverage/coverage.xml
#   - gate fail-closed: tools/coverage-gate.php --line-threshold=80 --branch-threshold=70
#     (stdout "Coverage: X.XX% lines (...)" identik -> regex badge GitLab juga match)
#   - artifact: var/coverage/ (clover XML + coverage.txt)
#
# Tidak ada secret GitLab di repo ini; hanya source/test/phpunit config (mirror
# publik tanpa artefak kanonik). Source repo canonical tetaplah zeflous/zef.

name: zef-coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
  # Runner standard GitHub = 2 vCPU / 7 GB RAM. Heap PHP 6144M menyisakan
  # ruang utk OS + Xdebug branch collection (anti OOM; GitLab OOM pada cgroup
  # ~3.5G, runner ini ~7G). Line-only di GitLab memakai 1024M; branch butuh lebih.
  PHP_MEMORY_LIMIT: "6144M"
  # PARITAS INSTRUMENTASI (Tahap 2 migrasi kanonik): versi Xdebug TUNGGAL
  # sumber-kebenaran. Dipakai oleh (a) pin `extensions: xdebug-<versi>` dan
  # (b) assert fail-closed di step "Verify PHP + Xdebug". Nilai HARUS sama
  # dengan image CI GitLab (${CI_IMAGE_BASE}:debug) — trace job 16390937176
  # menunjukkan "Xdebug OK: 3.5.3". Naikkan pin HANYA setelah image GitLab
  # naik versi (kalau tidak, denominator branch coverage bergeser).
  XDEBUG_PIN: "3.5.3"

jobs:
  coverage:
    name: PHPUnit + Xdebug branch coverage (2 vCPU / 7 GB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor/
            .composer-cache/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # PARITAS INSTRUMENTASI (Tahap 2 migrasi kanonik).
      # Dulu: `coverage: xdebug` -> setup-php memasang driver "latest" = Xdebug
      # 3.6.0alpha1 (pre-release; GH menandainya prerelease=false sehingga ikut
      # terpilih) rilis 2026-09-08, sementara image CI GitLab :debug memakai
      # Xdebug STABIL 3.5.3. Driver coverage beda versi = denominator branch
      # bergeser -> kriteria paritas P1–P12 TIDAK SAH ditetapkan.
      #
      # Input `coverage:` SENGAJA TIDAK DIPAKAI (dan pernah salah): `coverage: none`
      # memicu langkah "Setup Coverage" -> disable_all_shared yang berjalan SETELAH
      # instalasi ekstensi, sehingga Xdebug yang baru dipasang ikut dimatikan
      # (terbukti: run 34501898050 -> "none Disabled Xdebug and PCOV" lalu
      # "MISSING XDEBUG"). Tanpa input `coverage:`, setup-php tidak menyentuh driver
      # sama sekali. Rujukan: setup-php src/coverage.ts `case 'none': disable_all_shared`.
      #
      # Xdebug di-pin eksplisit via `extensions:` (sintaks semver -> PECL):
      #   xdebug-3.5.3  = pasang 3.5.3 + enable sebagai zend_extension
      #   redis         = AKTIFKAN (paritas: image GitLab kini memuat ext-redis)
      #   :apcu         = NONAKTIFKAN (paritas image GitLab yang tidak memuatnya)
      # KEPUTUSAN PARITAS REDIS (Tahap 2): ext-redis = phpredis CLIENT tanpa
      # server; 7 test Redis (RateLimiterDetailedTest) memakai createMock(Redis)
      # -> cukup `class_exists('Redis')`. Dahulu ext-redis di-nonaktifkan agar
      # 7 test itu SKIP di GitHub (menyamai GitLab); kini arahnya dibalik:
      # ekstensi dipasang di KEDUA sisi sehingga 7 test JALAN di keduanya
      # (|Δskip| = 0, coverage GitLab kembali ~86.99%).
      - name: Setup PHP 8.4 + Xdebug ${{ env.XDEBUG_PIN }} (pinned, paritas image GitLab CI :debug)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: xdebug-${{ env.XDEBUG_PIN }}, redis, :apcu
          tools: composer:v2
          ini-values: memory_limit=${{ env.PHP_MEMORY_LIMIT }}
        env:
          fail-fast: true

      # ASSERT FAIL-CLOSED instrumentasi: versi Xdebug HARUS persis sama dengan
      # pin (paritas image GitLab). Kalau setup-php kelak mengembalikan driver
      # "latest" (mis. alpha baru), run ini MERAH — bukan diam-diam drift.
      # Ini guard P6/P10 (digest & versi instrumen identik).
      - name: Verify PHP + Xdebug (fail-closed, pin 1:1 dgn GitLab)
        run: |
          set -euo pipefail
          php --version
          php -r '
            $pin = getenv("XDEBUG_PIN");
            if (!extension_loaded("xdebug")) { fwrite(STDERR, "MISSING XDEBUG - setup-php gagal" . PHP_EOL); exit(1); }
            $have = phpversion("xdebug");
            echo "Xdebug OK: " . $have . " (pin: " . $pin . ")" . PHP_EOL;
            if ($have !== $pin) { fwrite(STDERR, "XDEBUG DRIFT: terpasang " . $have . " != pin " . $pin . " (paritas GitLab <-> GitHub rusak)" . PHP_EOL); exit(1); }
          '

      # PARITAS EKSTENSI dengan image CI GitLab (Dockerfile.ci stage `base`):
      #   - ext-redis : ADA di kedua sisi (GitLab kini memasangnya) -> 7 test
      #                 Redis (RateLimiterDetailedTest) JALAN di keduanya.
      #   - APCu      : TIDAK ADA di kedua sisi -> test APCu SKIP di keduanya.
      # Skip-set identik = |Δskip| 0. Assert fail-closed di bawah: redis WAJIB
      # aktif (kalau setup-php gagal memasangnya, jangan diam-diam SKIP 7 test),
      # dan APCu WAJIB tidak aktif (kalau bocor aktif, skip-set bergeser).
      - name: Enforce extension parity (redis present, APCu absent)
        run: |
          set -e
          # Bersihkan hanya APCu (redis DIBIARKAN aktif).
          INI_DIR=$(php --ini | awk -F': ' '/Scan for additional .ini files/ {print $2}' | tr -d ' ')
          if [ -n "$INI_DIR" ] && [ -d "$INI_DIR" ]; then
            ls "$INI_DIR" | grep -qiE 'apcu' && sudo rm -f "$INI_DIR"/*apcu* || true
          fi
          MAIN_INI=$(php --ini | awk -F': ' '/Loaded Configuration File/ {print $2}' | tr -d ' ')
          if [ -n "$MAIN_INI" ] && [ -f "$MAIN_INI" ]; then
            sudo sed -i '/^extension[[:space:]]*=[[:space:]]*"\?apcu/d' "$MAIN_INI" || true
          fi
          php -r '
            $apcu = function_exists("apcu_fetch");
            $redis = extension_loaded("redis");
            echo "apcu_fetch available (harus false): "; var_export($apcu); echo PHP_EOL;
            echo "ext-redis loaded (harus true): "; var_export($redis); echo PHP_EOL;
            if (!$redis) { fwrite(STDERR, "PARITAS RUSAK: ext-redis TIDAK aktif di GitHub -> 7 test Redis akan SKIP (image GitLab memuatnya)." . PHP_EOL); exit(1); }
            if ($apcu) { fwrite(STDERR, "PARITAS RUSAK: APCu aktif di GitHub padahal image GitLab tidak memuatnya." . PHP_EOL); exit(1); }
          '

      - name: Composer install (lock 1:1)
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts --optimize-autoloader

      - name: PHPUnit + Xdebug branch coverage
        run: |
          mkdir -p var/phpunit var/coverage
          XDEBUG_MODE=coverage \
          php -d memory_limit="${PHP_MEMORY_LIMIT}" \
            vendor/bin/phpunit \
            --configuration phpunit.xml.dist \
            --colors=never \
            --coverage-clover=var/coverage/coverage.xml \
            --coverage-text=var/coverage/coverage.txt

      - name: Verify clover report (fail-closed)
        run: test -s var/coverage/coverage.xml

      - name: "Coverage gate (fail-closed: line>=80, branch>=70)"
        id: coverage-gate
        run: |
          set -euo pipefail
          php tools/coverage-gate.php \
            --clover=var/coverage/coverage.xml \
            --line-threshold=80 \
            --branch-threshold=70 | tee var/coverage/gate.txt

      # ============================================================
      # Fase 3: kirim balik Commit Status API ke GitLab zeflous/zef
      # (project 86155206) utk SHA zef yang di-mirror oleh job
      # coverage-offload (.gitlab-ci.yml). Status external check
      # github-actions/coverage tampil di commit/MR GitLab sbg bukti
      # coverage GitHub (state success/failed sesuai hasil gate).
      # Best-effort: bila subject commit TIDAK memuat "mirror(zef
      # <sha>)" (mis. workflow_dispatch manual / push langsung ke repo
      # GitHub), step di-skip exit 0 - tidak ada commit zef yang
      # berkorespondensi. Secret GITLAB_TOKEN tidak pernah di-echo
      # (GitHub Actions otomatis me-mask secret di log).
      # ============================================================
      - name: Report status to GitLab (Commit Status API - Fase 3)
        id: coverage-report-gitlab
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "skip: secret GITLAB_TOKEN tidak tersedia di repo ini"
            exit 0
          fi
          SUBJECT="$(git log -1 --pretty=%s)"
          ZEF_SHA_SHORT="$(printf '%s' "${SUBJECT}" | sed -nE 's/^mirror\(zef ([0-9a-f]{7,40})\):.*/\1/p')"
          if [ -z "${ZEF_SHA_SHORT}" ]; then
            echo "skip: subject commit bukan mirror offload (${SUBJECT}) - tidak ada SHA zef utk di-status"
            exit 0
          fi
          # Resolve short -> full SHA di GitLab (repo source canonical).
          FULL_SHA="$(curl -fsS --max-time 20 -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/86155206/repository/commits/${ZEF_SHA_SHORT}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])' 2>/dev/null || true)"
          if [ -z "${FULL_SHA}" ]; then
            echo "warning: tidak bisa resolve SHA zef ${ZEF_SHA_SHORT} di GitLab - status tidak dikirim"
            exit 0
          fi
          # State ditentukan oleh outcome step gate (if: always() ->
          # sukses DAN gagal sama-sama dilaporkan).
          if [ "${{ steps.coverage-gate.outcome }}" = "success" ]; then
            STATE="success"
            DESC="Coverage GitHub PASS: $(head -1 var/coverage/gate.txt 2>/dev/null || echo 'gate tidak terbaca')"
          else
            STATE="failed"
            DESC="Coverage GitHub FAILED - lihat run GitHub Actions"
          fi
          DESC="${DESC:0:200}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "== Kirim Commit Status ${STATE} utk zef ${FULL_SHA} (context: github-actions/coverage) =="
          PAYLOAD="$(python3 -c 'import json,sys;print(json.dumps({"state":sys.argv[1],"context":"github-actions/coverage","description":sys.argv[2],"target_url":sys.argv[3]}))' "${STATE}" "${DESC}" "${RUN_URL}")"
          HTTP_CODE="$(curl -sS --max-time 30 -o /tmp/gl-status-resp.json -w '%{http_code}' \
            -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -H "Content-Type: application/json" \
            "https://gitlab.com/api/v4/projects/86155206/statuses/${FULL_SHA}" -d "${PAYLOAD}")"
          echo "GitLab statuses API -> HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "201" ]; then
            echo "--- resp ---"
            head -c 500 /tmp/gl-status-resp.json 2>/dev/null || true
            echo ""
          fi

      - name: Summary (coverage values)
        if: always()
        run: |
          {
            echo "### Coverage (mirror zeflous/zef @ main)"
            echo '```'
            cat var/coverage/coverage.txt 2>/dev/null || echo "(coverage.txt tidak ada)"
            echo '```'
            echo "Gate:"
            echo '```'
            cat var/coverage/gate.txt 2>/dev/null || echo "(gate tidak jalan)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts (clover + text + gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zef-coverage-report
          path: |
            var/coverage/
            var/phpunit/
          if-no-files-found: warn
          retention-days: 14
